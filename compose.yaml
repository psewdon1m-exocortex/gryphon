name: gryphon

services:
  gryphon:
    build: .
    user: "1000:${GRYPHON_CLIENTS_GID:-1000}"
    restart: unless-stopped
    env_file: ${GRYPHON_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:18380:18380"
    networks:
      - exocortex-services
    volumes:
      - gryphon-data:/var/lib/gryphon
      - ${GRYPHON_RUN_DIR:-/run/gryphon}:/run/gryphon
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18380/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  gryphon-data:

networks:
  exocortex-services:
    external: true
