name: Gryphon CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: gryphon-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "12.3.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  pre-push-gate:
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate seven mandatory areas
        env:
          GATE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/pre-push-gate.py --upstream-result "${{ needs.verify.result }}" --report .pre-push-gate-report.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: gryphon-pre-push-gate-${{ github.sha }}
          path: .pre-push-gate-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
